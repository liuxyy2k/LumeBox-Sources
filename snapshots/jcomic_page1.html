<script>
document.addEventListener("DOMContentLoaded", function() {
    // Set up the Intersection Observer
    // rootMargin "800px" means: "Start decoding and downloading when the image is 800 pixels away from the screen"
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                let img = entry.target;
                let lockedStr = img.getAttribute('data-locked');
                
                if (lockedStr) {
                    try {
                        // 1. Strip the junk prefix
                        let cleanStr = lockedStr.replace("JCOMIC_TRAPS_", "");
                        
                        // 2. Reverse back to Base64
                        let unreversed = cleanStr.split('').reverse().join('');
                        
                        // 3. Decode and load the image
                        img.src = atob(unreversed);
                        
                        // Clean up
                        img.removeAttribute('data-locked');
                    } catch (error) {
                        console.error("Failed to unlock image.");
                    }
                }
                
                // Stop observing the image once it has been triggered
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "800px 0px 800px 0px" });

    // Find all protected images and attach the observer
    const images = document.querySelectorAll('.jcomic-img');
    images.forEach(img => {
        imageObserver.observe(img);
    });
});
</script>
