            isDesktop() {
                return document.documentElement.clientWidth >= 1024;

            prefixScenario(scenario) {
                return (this.isDesktop() ? 'desktop' : 'mobile') + '-' + scenario;
            },
            comicUrl(comic) {
                let url = 'https://mycomic.com/cn/comics/:comic'.replace(':comic', comic.id);

                if (comic.recommend_id) {
                    url += `#${comic.recommend_id}`;
                }

                return this.appendRecommendId(url);
            },
            chapterUrl(chapter) {
                if (! chapter.id) {
                    chapter = { id: chapter };
                }

                let url = 'https://mycomic.com/cn/chapters/:chapter'.replace(':chapter', chapter.id);

                if (chapter.recommend_id) {
                    url += `#${chapter.recommend_id}`;
                }

                return this.appendRecommendId(url);
            },
            appendRecommendId(url) {
                return url + (window.recommendId ? `#${window.recommendId}` : '');
            },
            placeholders(count) {
                let i, placeholders = [];

                for (i = 0; i < count; i++) {
                    placeholders.push([]);
                }

                return placeholders;
            },
            lozadObserve() {
                window.lozad('.lozad', {
                    rootMargin: '0px 0px 4000px 0px',
                }).observe();
            },
            syncUserUuid(userUuid) {
                if (userUuid) {
                    window.userUuid = userUuid;

                    Cookies.set('user_uuid', window.userUuid, { expires: 365 });
                }
            },
            getRecommendations(scenario, count, comicId) {
                const data = {
                    scenario: scenario,
                    cascadeCreate: true,
                    returnProperties: true,
                    includedProperties: [
                        this.locale === 'zh' ? 'name' : 'name_cn',
                        'recent_chapter_id',
                        this.locale === 'zh' ? 'recent_chapter_title' : 'recent_chapter_title_cn',
                        'recent_chapter_title_cn',
                        'cover_image_path',
                    ],
                };

                const transformResponse = response => response.recomms.map(item => {
                    item.values.id = item.id;
                    item.values.recommend_id = response.recommId;

                    if (this.locale === 'cn') {
                        item.values.name = item.values.name_cn;
                        item.values.recent_chapter_title = item.values.recent_chapter_title_cn;
                    }

                    return item.values;
                });

                const ensureUserUuid = callback => {
                    if (! window.userUuid) {
                        return setTimeout(() => ensureUserUuid(callback), 50);
                    }

                    callback();
                };

                if (comicId) {
                    return new Promise(resolve => {
                        ensureUserUuid(() => {
                            recombeeClient.send(new recombee.RecommendItemsToItem(comicId, window.userUuid, count, data)).then(response => {
                                resolve(transformResponse(response));
                            });
                        });
                    });
                }

                return new Promise(resolve => {
                    ensureUserUuid(() => {
                        recombeeClient.send(new recombee.RecommendItemsToUser(window.userUuid, count, data)).then(response => {

                        });

        <script type="application/ld+json">{"@context":"https:\/\/schema.org","@type":["BreadcrumbList","ComicIssue"],"itemListElement":[{"@type":"ListItem","position":1,"name":"漫画资料库","item":{"@type":"Thing","url":"https:\/\/mycomic.com\/cn\/comics","@id":"https:\/\/mycomic.com\/cn\/comics"}},{"@type":"ListItem","position":2,"name":"ONE PIECE航海王","item":{"@type":"Thing","url":"https:\/\/mycomic.com\/cn\/comics\/1128","@id":"https:\/\/mycomic.com\/cn\/comics\/1128"}},{"@type":"ListItem","position":3,"name":"第1150话","item":{"@type":"Thing","url":"https:\/\/mycomic.com\/cn\/chapters\/817597","@id":"https:\/\/mycomic.com\/cn\/chapters\/817597"}}],"issueNumber":1150,"audience":{"@type":"Audience","name":"少年"},"author":[{"@type":"Person","name":"尾田荣一郎"}],"countryOfOrigin":{"@type":"Country","name":"日本"},"datePublished":"2025-05-31T01:00:02+08:00","keywords":["热血","冒险","格斗"],"position":1150,"thumbnailUrl":"https:\/\/biccam.com\/comics\/1128-6f942d.jpg","alternateName":"海贼王","description":"财富 名声 势力，拥有这世界上的一切的“海贼王”哥尔·D·罗杰，在即将遭到处刑之前说出了一句话：“想要我的财宝吗？想要的话全给你吧！去找吧！我把这所有的财宝都放在那裡了！”，后来世界上的人们，将这个宝藏称做大秘宝ONE PIECE，许多人為争夺ONE PIECE，而争相先后出海成為海贼，世界迎来了『大海贼时代』！崇拜海贼的少年鲁夫，因為误食了恶魔的果实，成了身体能无限伸长的橡皮人，却也使他一辈子无法游泳。但鲁夫还是开始了他成為海贼王的冒险！与伙伴们分开行动的罗宾，宣言要离开鲁夫海贼团，并且消失在黑暗之中…。虽然一行人為了确定她的想法，而前去找她，但是陆续出现在眾人面前的全新事实，让一行人跌破眼镜！！一场争夺〝ONEPIECE〞的海上冒险故事！！為了阻止罗宾离开，鲁夫等人与ＣＰ９展开激战!?但是為了寻求古代兵器——〝冥王〞的设计图，ＣＰ９前来找佛朗基！!事实的真相到底是!?一场争夺〝ONEPIECE〞的海上冒险故事!！香吉士為了救出罗宾而搭上海上火车。另一方面，眾人还在水之诸神即将抵达的岛上寻找鲁夫与索隆。他们到底在哪裡……？就在这时候，水之诸神急速接近!?一场争夺「ONEPIECE」的海上冒险故事！乘上海上火车的香吉士与狙击王、佛朗基会合，开始进行罗宾夺回作战！但是车内有许多高手在等待著他们…另一方面，正在追他们的鲁夫等人…一场争夺「ONEPIECE」的海上冒险故事！為了夺回伙伴，鲁夫军团闯入了司法岛。但是敌人的势力强大，他们势必陷入苦战！另一方面，鲁夫与ＣＰ９的布鲁诺展开对峙！关心伙伴的想法，让他有了全新的觉醒…一场争夺「ONEPIECE」的海上冒险故事!!20年前───在西方蓝的「欧哈拉」，有一位被称為妖怪，被大家惧怕，并且度过悲惨人生的少女。她的名字是妮可．罗宾…。让她坠入绝望深渊的惊人过去到底是什么!？一场争夺〝ONEPIECE〞的海上冒险故事!!长官对ＣＰ９下令抹杀冲入司法之塔的鲁夫等人!!鲁夫等人是否能够打倒阻挡去路的ＣＰ９，顺利的把罗宾夺回来呢!?草帽一行人VSＣＰ９的全面对决开始了!!一场争夺〝ONEPIECE〞的海上冒险故事!!「非常召集」已经发动，罗宾也即将抵达最终极限点「正义之门」！在这分秒必争的状况下，鲁夫等人能不能突破CP9的阻碍，把她从绝望深渊中救出来！？一场争夺「ONEPIECE」的海上冒险故事！草帽海贼团成功与罗宾会合，开始寻找逃脱路线。但是因為受到「非常召集」的影响，让他们陷入危机之中！鲁夫VS路基的激战又会有什么样的结果呢？紧张的CP9篇终于落幕！一场争夺「ONEPIECE」的海上冒险故事！激战结束之后，当鲁夫等人接下佛朗基帮他们建造的新船时，有个意想不到的人物来找他们!!另一方面，还没有回到海贼团的骗人布，则是一直在预习该怎么让自己回到海贼团…!?一场争夺「ONEPIECE」的海上冒险故事！搭上全新的船迈向鱼人岛的鲁夫一行人，因為被捲进风暴之中，而跑进了「魔幻三角地带」。他们在那裡遇到一个奇怪的人物，但鲁夫却突然说出惊人的话？而且还登錄某座岛屿？一场争夺「ONEPIECE」的海上冒险故事！影子被夺走的布鲁克，遭到殭尸攻击的娜美等人，鲁夫一行人的伙伴陆续消失。恐怖三桅帆船一直在发生不可思议的事情…!!这一切的真相即将被慢慢解开!?一场争夺「ONEPIECE」的海上冒险故事!!為了在天亮之前，从摩利亚手中夺回影子，鲁夫一行人再次杀进恐怖三桅帆船。但是四怪人＆殭尸军团＆得到鲁夫影子的魔人欧斯却前来阻碍他们!!一场争夺「ONEPIECE」的海上冒险故事!!黎明即将来临，夺回影子的最后极限也在慢慢逼近。就在这时候，摩利亚进入了欧斯的腹部，让欧斯变得更难对付！但是，就在海贼团屈居劣势的时候，变身之后的鲁夫现身了!?一场争夺「ONEPIECE」的海上冒险故事！面对把1000个影子放进体内，藉此发挥出强大力量的摩利亚，鲁夫即使已经超越身体能够承受的极限，还是继续用「档」对抗敌人！以恐怖三桅帆船為舞台的激战终于要画下句点!!一场争夺「ONEPIECE」的海上冒险故事！想要前往鱼人岛的鲁夫等人抵达一个有泡泡飞舞的岛屿。但那是个还有古老历史留存的异样岛屿！而且11位悬赏金额破「亿」的悬赏对象集结在一起，因而发生了新的事件!?一场争夺「ONEPIECE」的海上冒险故事!!看到「大熊」陆续用能力让伙伴消失，束手无策的鲁夫显得非常沮丧。悲痛的怒吼无法传到伙伴的耳中，一行人面临被拆散的惊人状况!!鲁夫…还有他的伙伴到底跑到哪裡去了…。一场争夺「ONEPIECE」的海上冒险故事!!想要解救哥哥艾斯。鲁夫抱持这个想法，挑战监狱局长麦哲伦!!这场绝对不能退让的战斗的结果会是…。而就在这时候，移送艾斯的时间则是无情的到来…!?一场争夺「ONEPIECE」的海上冒险故事!!鲁夫与伊娃先生等人一起追逐被押解的艾斯。但是这条路却非常艰辛…。之后，震撼世界的惊人事实即将被揭开!!一场争夺「ONEPIECE」的海上冒险故事!!世界最强的海贼行动了！！為了夺回艾斯，「白鬍子」大舰队与「海军」及「王下七武海」展开全面战争！！这场震撼全世界的顶点决战，鲁夫能够赶上吗？一场争夺「ONEPIECE」的海上冒险故事！！草帽海贼团因為殴打天龙人而遭到海军追杀！面对陆续送来的海军战力，被捲进去的新星们也陷入苦战！而且上将「黄猿」也登陆，让岛上变成一片火海…。一场争夺「ONEPIECE」的海上冒险故事!!就在艾斯即将被公开处刑之时，鲁夫在汉考克的协助之下，终于能够前往海底监狱．推进城。面对处于戒严态势的狱卒们，鲁夫為了救出哥哥．艾斯而努力奋战!!一场争夺「ONEPIECE」的海上冒险故事!!白鬍子被刺杀了！！这起惊人的事情到底会给这场大战但来什么样的影响…。另一方面，鲁夫正在赶往艾斯身边，但是上将等经历过许多战斗的猛将们，却阻挡了鲁夫的去路…？！一场争夺「ONEPIECE」的海上冒险故事！！以海军本部為舞台的大战即将结束。鲁夫、艾斯等与这场战争有关的所有人最后到底会有什么样的命运？！任何人都想像不到的惊人结局即将来临！！一场争夺「ONEPIECE」的海上冒险故事！！恶童３人．艾斯、萨波与鲁夫到底经历过什么事情？！现在，过去的历史要被揭开了！！──失去艾斯的鲁夫，到底能不能超越这个悲伤…？！一场争夺「ONEPIECE」的海上冒险故事！！「草帽一行人」解读了鲁夫发出的讯息，开始為了即将来临的时刻做准备。各自怀著想法，再次集结的鲁夫等人，开始踏上继续前往「新世界」的冒险之旅！！一场争夺「ONEPIECE」的海上冒险故事！！成功再次集结的草冒一行人，為了前往新世界，而出发迈向位于海底1万公尺处的「鱼人岛」！！但是，路上却遇到许多难题，让一行人再次遇到危机！？一场争夺「ONEPIECE」的海上冒险故事！！白星公主终于跟著鲁夫一起离开硬壳塔，并且一起前往「海之森林」。在那裡，他们遇到的吉贝尔所提到的长久存在于鱼人岛的悲剧历史到底是什么！？一场争夺「ONEPIECE」的海上冒险故事！！鱼人岛继承已故王妃的想法，渐渐地接近理想。但是荷帝所率领的新鱼人海贼团却粉碎了这个美梦!!把鲁夫等人也捲进来的鱼人岛激战正式开始!!一场争夺「ONEPIECE」的海上冒险故事!!草帽一行人挺身阻止企图控制鱼人岛的荷帝所率领的「新鱼人海贼团」！在海中交战时，荷帝对陷入苦战的鲁夫做出更残忍的事情…！！而且惨剧也正在逼近鱼人岛！！一场争夺「ONEPIECE」的海上冒险故事！！鱼人与人类之间，到底能不能消去过去的因缘，并且建立新的牵绊!?鱼人岛篇达到最高潮!!草帽一行人终于出发航向最后的大海．「新世界」!!接下来到底有什么样的冒险在等著他们!?一场争夺「ONEPIECE」的海上冒险故事!!只有下半身的男子、炎热与寒冷同时存在的岛屿。在充满谜团的新世界「庞克哈萨特」发生了全新的事件!!因為突然有个意想不到的人物出现，使得事情变得更加混乱…!?一场争夺「ONEPIECE」的海上冒险故事!鲁夫接受罗的提议，组成了「海贼同盟」。他们靠著这强力的同盟来对抗凯萨!!為了造成混乱，罗企图绑架凯萨，但是却发生意想不到的事情!?一场争夺「ONEPIECE」的海上冒险故事!!毒气「死之国」飘进研究所了!!在这种非常危急的状况下，鲁夫等人一边朝著能够逃出去的门前进，一边追逐凯萨的下落!!鲁夫等人要怎么挑战暗中活跃的那些人们!?一场争夺「ONEPIECE」的海上冒险故事!!就在即将逃出研究所之前，凯萨突然发生惊人变化。鲁夫能够击碎他的野心吗!?而在暗地裡穿针引线的七武海．多佛朗明哥也开始行动，状况急转直下…!!一场争夺「ONEPIECE」的海上冒险故事!!鲁夫一行人潜入到多佛朗明哥治理下的王国「多雷斯罗萨」!!鲁夫本来的目标是破坯「SMILE」工厂，但因斗技场大赛的奖品是某颗果实，于是他便迅速跑去报名参赛了!?一场争夺「ONEPIECE」的海上冒险故事！面对设下许多狡猾陷阱的多佛朗明哥，罗将会如何应对!?被小人族抓住的骗人布他们又会怎么样呢!?决心拿到「火焰果实」的鲁夫能够如愿抢到吗!?各种思绪纵横交错…。一场争夺「ONEPIECE」的海上冒险故事!!罗的计划全部落空，状况越加往无法预期的方向发展，而多雷斯罗萨过往的悲剧也在此时被揭露。每一边的状况都在往全面战争发展，决战时刻逐渐迫近……一场争夺「ONEPIECE」的海上冒险故事！ＳＯＰ作战实行！為了解放被变成玩具的人们，骗人布等人找上干部砂糖，他们的命运将会是…！另一方面，鲁夫等人也从别的地方开始追赶多佛朗明哥，然而……一场争夺「ONEPIECE」的海上冒险故事！经过骗人布的活跃！砂糖昏倒，被变成玩具的人们也终于被解放了！就在整座岛都陷入混乱之时，怒火中烧的多佛朗明哥使用了某个策略，将鲁夫等人推向险境！一场争夺「ONEPIECE」的海上冒险故事！","image":"https:\/\/biccam.com\/comics\/1128-6f942d.jpg","name":"ONE PIECE航海王 - 第1150话","url":"https:\/\/mycomic.com\/cn\/chapters\/817597"}</script>
